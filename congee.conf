# congee configuration - conky-style syntax.
# Settings go above the TEXT line; everything below TEXT is the template.
# The file is watched: save it and the widget reloads automatically.
# See README.md for every setting and $variable.

alignment top_right
gap_x 24
gap_y 48
minimum_width 300
update_interval 1
font Consolas:size=10

default_color d8dee9
color1 88c0d0
color2 a3be8c
color3 ebcb8b
color4 bf616a
draw_shades yes
default_shade_color black

own_window_type desktop
own_window_transparent yes
border_inner_margin 10
default_bar_height 6
default_graph_height 26

# Which GPU the gpu_* variables read: auto (prefers a dedicated card),
# 0/1/... (order shown by --sensors), or part of its name, e.g. "GeForce".
gpu auto

# Show temperatures in celsius or fahrenheit. ${temp_unit} below prints °C or °F to match.
# (Bars and graphs, and temp_bar_max, always work in °C.)
temperature_unit celsius

TEXT
${font Segoe UI:bold:size=26}${color1}${time %H:%M}${font Segoe UI:size=10}${color}  ${time %A, %d %B %Y}
${font}${color1}SYSTEM ${hr 1}${color}
Host${alignr}$nodename
OS${alignr}$os (build $kernel)
Uptime${alignr}$uptime
${color1}CPU ${hr 1}${color}
${cpu_name}
Usage ${cpu}%${alignr}${cpubar 6,180}
${cpugraph cpu0 30,0 a3be8c bf616a}
${if_sensors}${if_gpu}${color1}GPU ${hr 1}${color}
${gpu_name}
Driver ${gpu_driver}${alignr}${gpu_driver_date}
Usage ${gpu_load}%  ${gpu_clock} MHz${alignr}${gpu_power} W
${gpu_loadgraph 26,0 a3be8c bf616a}
VRAM ${gpu_vram_used} / ${gpu_vram_total}${alignr}${gpu_vram_perc}%
${gpu_vrambar}
${endif}${color1}TEMPERATURES ${hr 1}${color}
CPU${goto 120}${cpu_temp}${temp_unit}${alignr}${cpu_tempbar 6,120}
${if_gpu}GPU core${goto 120}${gpu_temp}${temp_unit}${alignr}${gpu_tempbar 6,120}
${endif}${if_gpu_sensor temperature Hot Spot}GPU hot spot${goto 120}${gpu_hotspot}${temp_unit}${alignr}${gpu_tempbar 6,120 Hot Spot}
${endif}${if_gpu_sensor temperature GPU Memory}GPU memory${goto 120}${gpu_memtemp}${temp_unit}${alignr}${gpu_tempbar 6,120 GPU Memory}
${endif}${if_sensor temperature Composite}NVMe SSD${goto 120}${temp Composite}${temp_unit}${alignr}${tempbar 6,120 Composite}
${endif}${if_sensor temperature DIMM}RAM${goto 120}${temp DIMM}${temp_unit}${alignr}${tempbar 6,120 DIMM}
${endif}${cpu_tempgraph 26,0 ebcb8b bf616a}
${color1}FANS ${hr 1}${color}
${if_gpu_sensor fan}GPU fan${goto 120}${gpu_fan} RPM${alignr}${gpu_fan_perc}%
${endif}${if_sensor fan Fan #1}Fan #1${goto 120}${fan Fan #1} RPM${alignr}Fan #2  ${fan Fan #2} RPM
${endif}${if_sensor fan Fan #3}Fan #3${goto 120}${fan Fan #3} RPM${alignr}Fan #4  ${fan Fan #4} RPM
${endif}${if_sensor fan Fan #5}Fan #5${goto 120}${fan Fan #5} RPM${alignr}Fan #6  ${fan Fan #6} RPM
${endif}${else}${color4}Temps/fans: start LibreHardwareMonitor (as admin)${color}
${endif}${color1}MEMORY ${hr 1}${color}
RAM  $mem / $memmax${alignr}$memperc%
${membar}
Swap $swap / $swapmax${alignr}$swapperc%
${swapbar}
${color1}DISK ${hr 1}${color}
${for_each_drive}${drive}  ${drive_label}${alignr}${fs_used} / ${fs_size}  ${fs_used_perc}%
${fs_bar 6,0}
Read ${diskio_read}/s${alignr}Write ${diskio_write}/s
${endfor}${color1}NETWORK ${hr 1}${color}
IP${alignr}${addr}
Down ${downspeed}/s${alignr}Up ${upspeed}/s
${downspeedgraph 24,145 88c0d0 a3be8c}${alignr}${upspeedgraph 24,145 ebcb8b bf616a}
Total down $totaldown${alignr}Total up $totalup
${color1}TOP PROCESSES ${hr 1}${color}
${color3}Name${goto 170}CPU%${alignr}Memory${color}
${top name 1}${goto 170}${top cpu 1}${alignr}${top mem_res 1}
${top name 2}${goto 170}${top cpu 2}${alignr}${top mem_res 2}
${top name 3}${goto 170}${top cpu 3}${alignr}${top mem_res 3}
${top name 4}${goto 170}${top cpu 4}${alignr}${top mem_res 4}
${top name 5}${goto 170}${top cpu 5}${alignr}${top mem_res 5}
${if_battery}${color1}BATTERY ${hr 1}${color}
${battery_percent}% ${battery_status}${alignr}${battery_time}
${battery_bar}${endif}